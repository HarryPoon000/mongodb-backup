name: Env file check

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-file-check:
    name: Check for committed env files
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for env files
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          ENV_PATTERN='(^|/)(\.env|\.env[._-][^/]+|[^/]+\.env)$'
          ALLOWED_PATTERN='[._-](example|sample|template|dist)$'

          filter_env_files() {
            grep -E "$ENV_PATTERN" | grep -viE "$ALLOWED_PATTERN" | sort -u || true
          }

          ZERO_SHA='0000000000000000000000000000000000000000'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BEFORE" != "$ZERO_SHA" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            BASE="$PUSH_BEFORE"
          else
            BASE="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA" 2>/dev/null || true)"
          fi

          if [ -n "$BASE" ]; then
            RANGE="$BASE..$HEAD_SHA"
          else
            RANGE="$HEAD_SHA"
          fi
          echo "Scanning commits in $RANGE and the tree at $HEAD_SHA"

          IN_TREE="$(git ls-tree -r --name-only "$HEAD_SHA" | filter_env_files)"
          IN_HISTORY="$(git log --format= --name-only --diff-filter=ACMR "$RANGE" | filter_env_files)"
          FOUND="$(printf '%s\n%s\n' "$IN_TREE" "$IN_HISTORY" | sed '/^$/d' | sort -u)"

          if [ -z "$FOUND" ]; then
            echo "No env files found."
            exit 0
          fi

          {
            echo "## :warning: Env file(s) committed"
            echo
            echo "| File | Commit | Still in tree |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r file; do
            commit="$(git log -1 --format='%h %s' --diff-filter=ACMR "$RANGE" -- "$file" || true)"
            [ -z "$commit" ] && commit="$(git log -1 --format='%h %s' "$HEAD_SHA" -- "$file" || true)"
            if printf '%s\n' "$IN_TREE" | grep -qxF "$file"; then in_tree="yes"; else in_tree="no (still in history)"; fi
            echo "::error file=$file::Env file '$file' was committed ($commit). Remove it and rotate any secrets it contains."
            echo "| \`$file\` | $commit | $in_tree |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$FOUND"

          {
            echo
            echo "Remove with \`git rm --cached <file>\` and make sure it is covered by \`.gitignore\`."
            echo "If the file was pushed, treat its secrets as leaked and rotate them; deleting it in a later commit does not remove it from history."
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1
